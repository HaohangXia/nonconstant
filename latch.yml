# latch · 项目配置
#
# ⛔ 判定逻辑不在本文件 —— 逻辑在 .latch/(见 CLAUDE.md B4)。
# ⭐ 本文件自身是受保护对象:改它必须判红。考卷不能由考生自己改。

# 受保护路径:被判定者改动其中任何一个 ⇒ hard 红
# ⛔ 不得写 src/**(latch 无 src/,该模式恒不命中 = 常量,违反 §3 序 4)
protected:
  - latch.yml
  - .latch/**

# ⭐⭐ 判定的基线。⛔ 只能由操作者在本文件里给 —— 本文件受 criteria-guard 保护。
# ⛔ 闸不接受来自调用方的 base:被判定者可选一个「改完判据之后」的基线把改动藏进去
#    ⇒ 差集为空 ⇒ 判绿 ⇒ 判定的输入被被判定者控制 ⇒ T1 失效。
# 依据:§6 Q16 · LATCH-input-control · amendments/A004-base-from-config.md
base: HEAD

# ⭐⭐ 上游 pin。⛔ 「pin」必须是可核事实,不是一句话(A005)。
#    vendor/spec-kit 是 submodule ⇒ 它记的**就是 commit 本身**,
#    ⛔ 不是版本声明、不是内容摘要。判据见 .latch/upstream-pin.sh。
upstream_pin: bca679051abb80d6cf0cd909f2539a28a10eb7eb

# ⭐⭐ 被判定对象的路径。⛔ 判据里不得再有硬编码默认值 ——
#    硬编码 = 悄悄指向 latch 自己的仓布局,装到别的项目里必然判 2(A006 探针 4 实测)。
#    ⚠️ 与 base 不同:base 是**判定的基线**(A004:⛔ 不接受调用方给);
#    ⭐ subject 是**被判定的对象本身** —— 换掉它等于换考卷,⛔ 不是换答案
#    ⇒ 允许 argv 覆盖(红检要指向 fixture,C3)。
#    ⛔ 键缺失 ⇒ 判据判 2,⛔ 不得回落到某个默认路径。
subjects:
  status: docs/audit/STATUS.md
  plan: docs/audit/01-PLAN.md
  reports: reports
  upstream_src: vendor/spec-kit/src
  readme: README.md

# 判据清单。level: hard = 阻断且不可 waiver(01-PLAN §5 P4)
#
# ⭐⭐ scope(A006):每条判据必须声明它属于哪一类,⛔ meta-gate 查「声明了且取值合法」。
#   project   判被装项目自己的产物,路径可配 ⇒ ⭐ 可分发
#   upstream  判上游(⭐ 指向用户实际会跑的那份 spec-kit)⇒ ⭐ 可分发,⚠️ 需已装 spec-kit
#   bootstrap ⛔ 仅 latch 自举(结构上需要 submodule)⇒ ⛔ 不分发
#   ⇒ 可分发 ≡ scope != bootstrap。⛔ 安装脚本据此决定装哪些,不靠人挑。
#
# ⭐⭐ 元判据(§3 序 4):每条判据必须登记「一过一失败」的演示,否则不得启用。
#    demo_pass_exit 必须为 0;demo_fail_exit 必须非 0;两者方向相同 = 仍是常量。
#    ⛔ 未登记 = 拒绝启用,⛔ 不是「先用着」。
gates:
  - id: criteria-guard
    scope: project
    level: hard
    impl: .latch/gates.sh
    desc: 判据文件不得被被判定者修改
    demo_pass: 只改 docs/audit/README.md 后跑
    demo_pass_exit: 0
    demo_fail: 改 latch.yml 内容后跑
    demo_fail_exit: 1
    demo_report: reports/phase1-ae6f82f.md

  - id: silent-scan
    scope: project
    level: hard
    impl: .latch/scan-silent.sh
    desc: 静默失败扫描（⛔ 函数作用域，不用行数窗口）
    demo_pass: 干净 fixture（capture_output 后查了 returncode）
    demo_pass_exit: 0
    demo_fail: 脏 fixture（capture_output 未查 / except:pass / '|| true' / 2>/dev/null）
    demo_fail_exit: 1
    demo_report: reports/phase2-5a3420d.md
    # ⚠️ 尚未接入编排层；当前需显式给扫描目录。见 reports/phase2-*.md known_gaps
    #
    # ⭐⭐ Phase 10:自扫豁免已【消除】(⛔ 非被满足)。原 exclude 块整块删除 ——
    #    根因是消息文本嵌了模式串,改用模式的名字即可,0 净增行。
    #    ⛔ 不要因为自扫判红就把它加回来:先看 FAIL 输出末尾那两行提示。

  - id: meta-gate
    scope: project
    level: hard
    impl: .latch/meta-gate.sh
    desc: 判据可执行性——未演示「一过一失败」的判据不得启用
    demo_pass: 本文件（每条判据都登记了双向演示）
    demo_pass_exit: 0
    demo_fail: fixture 配置（某条判据缺 demo_fail_exit，或双向同号）
    demo_fail_exit: 1
    demo_report: reports/phase3-cad8012.md
    # ⚠️ 能力边界（⭐ 承认，⛔ 不修）：本闸只查「登记了没有」，⛔ 查不了「演示是否真跑过」。
    #    demo_*_exit 是写在本文件里的数字；填了没跑照样放行。
    #    ⇒ 与协议 R8 完全同形：只挡「完全没做」，⛔ 挡不住「做了但敷衍」（D5，不可根治）。
    #    ⛔ 收紧方向（配置里存可执行命令、真去跑）会引入更坏的问题：
    #       那些命令由谁提供？被判定者提供就又是 T1 失效。⇒ 与 hook 拦不住 Bash 同类。

  - id: report-pin
    scope: project
    level: hard
    impl: .latch/report.sh
    desc: 完成报告文件名须含它所描述的那个 commit 的短 hash
    demo_pass: reports/phase1-ae6f82f.md（ae6f82f 在历史中且是 HEAD 祖先）
    demo_pass_exit: 0
    demo_fail: 伪 hash（deadbee）
    demo_fail_exit: 1
    demo_report: reports/phase3-cad8012.md

  - id: status-facts
    scope: project
    level: hard
    impl: .latch/status-facts.sh
    desc: STATUS 断言须与仓库一致——它的失真可判定（⛔ 不是 D5）
    demo_pass: 真源 STATUS（22 条断言：判据表三元组 id|impl|level、phase 编号集合、上游 pin、amendments 区间、清单路径）
    demo_pass_exit: 0
    demo_fail: fixture STATUS（六类各一：漏一个 phase 编号 / level 写错 / impl 张冠李戴 / 少列一行 / pin 写错 / amendments 区间过期）
    demo_fail_exit: 1
    demo_report: reports/phase4-900b8de.md
    # ⭐ 每条断言归谁守，见 docs/audit/19-STATUS-ASSERTIONS.md（⛔ 不可对照的已在 STATUS 就地标注）
    #
    # ⭐⭐ C12 · 覆盖面自检的期望值。本判据用正则「匹配」定位被判断言 ⇒
    #    ⛔ 匹配失败与「没有该断言」不可区分 ⇒ 措辞一变就静默少查一类，而判据仍报 PASS。
    #    ⇒ 判据声明须查 N 类；实现 I 类；本次匹到 M 类。I≠N ⇒ 2；M<I ⇒ 1。
    #    ⚠️ N 放在这里（⛔ 不在脚本里）是有意的：改脚本删掉一整类，改不掉这个数 ⇒ 判 2。
    #    ⚠️ 且本文件在 protected 内 ⇒ 改 N 会被 criteria-guard 判红（已实测：exit 1）。
    #    六类：gate-count · phase-set · gate-table · upstream-pin · amendments · table-paths
    expected_assertion_classes: 6

  - id: waiver-expiry
    scope: project
    level: hard
    impl: .latch/waiver-expiry.sh
    desc: 豁免到期——写下的到期没有判据 = 没有到期
    demo_pass: 真源（until = Phase 10，未到达且已排期）
    demo_pass_exit: 0
    demo_fail: fixture（until 指向已完成的 Phase 1 / 非具体 phase / 未排期的 Phase 99）
    demo_fail_exit: 1
    demo_report: reports/phase5-30005dc.md

  - id: upstream-semantics
    scope: upstream
    level: hard
    impl: .latch/upstream-semantics.sh
    desc: 上游语义——真跑两个 step 观察行为（⛔ 不判文件内容，否则合法升级即误报）
    demo_pass: 当前 vendor v1.0.0（shell 退出码语义 + gate 不自动放行 + on_reject=abort）
    demo_pass_exit: 0
    demo_fail: vendor 副本里把 shell step 的 FAILED 改成 COMPLETED
    demo_fail_exit: 1
    demo_report: reports/phase6-33a1b16.md

  - id: upstream-pin
    scope: bootstrap
    level: hard
    impl: .latch/upstream-pin.sh
    desc: 上游 pin 可核 + 未被本地改过（⭐ submodule 记的就是 commit 本身）
    demo_pass: submodule 停在 upstream_pin 且工作区干净
    demo_pass_exit: 0
    demo_fail: 切到别的 commit / 改上游文件 / 往上游塞新文件
    demo_fail_exit: 1
    demo_report: reports/phase7-4dddca8.md

  - id: readme-runnable
    scope: bootstrap
    level: hard
    impl: .latch/readme-runnable.sh
    desc: README 里的命令必须真能跑，且三条必含内容不得隐去（A008）
    demo_pass: 真源 README（命令引用均存在 + 三个披露锚点齐全）
    demo_pass_exit: 0
    demo_fail: fixture README（命令指向不存在的文件 / 抹掉某个披露锚点）
    demo_fail_exit: 1
    demo_report: reports/phase11-e19e562.md
    # ⛔ scope: bootstrap —— 它判的是 latch 自己的 README，⛔ 不随安装分发。
    # ⚠️ 能力边界（⭐ 承认，⛔ 不修）：查得了「命令指向的文件在不在」「披露锚点在不在」，
    #    ⛔ 查不了「README 有没有说服力」——那是 D5，A008 §6 已承认。

  - id: doc-budget
    scope: project
    level: soft
    impl: .latch/doc-budget.sh
    desc: 文档预算——写下的上限必须有机器判据（协议 C8）
    demo_pass: 三个文件均在预算内
    demo_pass_exit: 0
    demo_fail: fixture 配置把某文件上限调到极小且不登记 waiver
    demo_fail_exit: 1
    demo_report: reports/phase3-cad8012.md

# ⭐ 文档预算。⛔ 上限写在这里才有人查 —— 写在文件抬头的注释里没有任何东西执行。
# exclude_sections:A001 的 scope 模型，列出的 `## §<n>` 章节不计入。
# 超限须登记 waiver_reason + waiver_until（⛔ 须是具体 phase，不得是「以后」）。
doc_budgets:
  - file: docs/audit/01-PLAN.md
    max_lines: 400
    exclude_sections: 2 8 9      # 档案，依据 A001
  - file: docs/audit/18-PROTOCOL.md
    max_lines: 80
    exclude_sections: 5          # §5 是撤回档案，依据 A001 的 scope 模型（⛔ 非新契约）
  - file: docs/audit/STATUS.md
    max_lines: 60
  - file: docs/audit/19-STATUS-ASSERTIONS.md
    max_lines: 70

# 预算(01-PLAN §7a / CLAUDE.md B6)
budget:
  plan_max_lines: 400
  new_files_max: 8
